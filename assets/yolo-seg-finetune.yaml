# YOLO26l-seg fine-tuning arguments for the /data/4T-1/hewu/dataset/yolo segmentation set.
# Consumed by tools/finetune_yolo_seg.py through `cfg=`, which forwards it to YOLO.train; any value
# can be overridden on the command line, e.g. `epochs=10 batch=16`.
#
# The starting checkpoint is runs/pretrained/weights/best.pt, whose train_args name is
# output_parts_20260723_mixed_14 (2026-08-09, Ultralytics 8.4.104, itself a 20-epoch continuation
# of output_parts_20260723_mixed_13/weights/last.pt). It carries the same 5 classes as this data and
# was NOT trained on this capture, so this is a fine-tune of a checkpoint that already separates both
# target classes at conf 0.8 - not a re-learn.
#
# The structural knobs (optimizer AdamW, batch 18, imgsz, momentum, weight_decay, deterministic, loss
# weights, mask_ratio, mixup 0.05, degrees 40) are taken from that checkpoint's train_args so this run
# stays comparable with the model it starts from. nbs 18 and amp bf16 replace the checkpoint's
# nbs 64 / fp32, and the schedule deviates too: replaying the checkpoint's lr0 5e-05 / linear decay /
# mosaic 0.1 on 218 new images moves the model too little to be a fine-tune.
# Only the data-loading knobs (cache, workers) and the unused predict/export block are untouched:
# cache ram fits 242 images in RAM, skipping the on-disk .npy warm-up pass that v4's 100k-image set
# needs.
#
# This is deliberately a two-class fine-tune: the labels carry only elbow_pipe (class 3, 638
# instances) and interior_door_handle (class 4, 483), and only those two matter downstream. Classes
# 0/1/2 keep their slots in the 5-class head but get no positive supervision here, so their logits
# drift toward background over the run (catastrophic forgetting). That is accepted - filter to 3/4 at
# inference. Do not read the val metrics as a 5-class score: Ultralytics only tabulates classes that
# have instances, so the `all` row means "elbow_pipe + interior_door_handle" (24 images / 121
# instances, 65 + 56). If those three classes are ever needed again, mix in replay data that carries
# them and freeze the backbone rather than reusing this file as-is.
#
# The 24-image val set is a frame-level random 10% cut of one continuous screenshot series, so it
# holds frames adjacent to train frames (e.g. 0224/0225) and reads optimistically. Use it as a smoke
# test, not as a generalization estimate; its run-to-run swing is around +-0.03 mAP50-95, wider than
# most hyperparameter effects, so compare seeds rather than single runs.
#
# cls_pw is left at 0.0 (unweighted), matching the checkpoint. The two labelled classes sit at
# 638:483 = 1.3x, which needs no reweighting; cls_pw addresses frequent-vs-rare, not
# labelled-vs-absent.
#
# Values not used by `mode=train` (conf, vid_stride, format, opset, ...) are kept verbatim from the
# from-scratch file so the same file still drives val/export runs.

task: segment
project: ultralytics/yolo26
name: yolo-seg-finetune
exist_ok: false
epochs: 30
batch: 18
nbs: 18
imgsz: 640
workers: 8
cache: ram
deterministic: true
amp: bf16
optimizer: AdamW
pretrained: true
save: true
verbose: true
multi_scale: 0.0
mask_ratio: 2
classes:
conf:
embed:
line_width:
opset:
workspace:

# Validation
split: val
# 'val' in data.yaml is a directory, so is_coco is False and the COCO-JSON eval never runs.
save_json: false
plots: true

# Loss weights
box: 7.5
cls: 0.5
dfl: 1.5
cls_pw: 0.0

# Optimizer schedule
# Deviates from the checkpoint on purpose: lr0 0.0001 is 2x the 5e-05 it was last optimised at, and
# cos_lr true replaces the checkpoint's linear decay. lrf 0.01 decays it to ~1e-06 by epoch 30, so the
# tail settles instead of being cut while lr is still high. warmup_epochs 0 matches the checkpoint.
lr0: 0.0001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Augmentation
# Full mosaic is back for the 218-image train set: 0.1 was the checkpoint's value on a much larger
# corpus, and four-way composition is the main source of new context here.
mosaic: 1.0
# Also disables copy_paste, mixup and cutmix for the final N epochs, so keep the share bounded.
# 2 is the checkpoint's value; now that mosaic is 1.0 a longer no-augmentation tail is worth trying.
close_mosaic: 5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
# Restored to the checkpoint's value: 40 deg is the geometric range it was trained at, so rotation is
# in-distribution for this checkpoint even though the capture itself is fixed-camera.
degrees: 40.0
translate: 0.15
scale: 0.3
fliplr: 0.5
# Re-enabled at the checkpoint's own value. MixUp blends two images and concatenates both instance
# sets, so every mask stays tied to a real annotation, but a blended mask no longer describes what is
# visible under it. That hits the already-weaker mask metric first - watch mask mAP50-95, not box.
# close_mosaic zeroes mixup for the final 5 epochs, so it only runs in epochs 1-25.
mixup: 0.05
copy_paste: 0.3

# Prediction / export
agnostic_nms: false
augment: false
dynamic: false
format: torchscript
keras: false
nms: false
optimize: false
retina_masks: false
simplify: true
stream_buffer: false
vid_stride: 1
visualize: false
show: false
save_conf: false
save_crop: false
save_frames: false
save_txt: false
show_boxes: true
show_conf: true
show_labels: true
tracker: botsort.yaml