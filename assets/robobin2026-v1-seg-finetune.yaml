# YOLO26l-seg fine-tuning arguments for robobin2026-v1 instance segmentation.
# Consumed by scripts/run_train_robobin2026_v1_seg.sh via `cfg=`. Any value here can be
# overridden on the command line, e.g. `... epochs=10 batch=64`.
#
# The starting point is the from-scratch recipe in yolo26l-seg-train.yaml. Only what fine-tuning
# from assets/yolo26l-seg.pt changes is adjusted: epochs 300 -> 100, lr0 0.01 -> 0.001, and
# pretrained turned back on. See runs/robobin2026/dataset_stats.md for the dataset statistics.
#
# Values not used by `mode=train` (conf, vid_stride, format, opset, ...) are kept verbatim from
# the from-scratch file so the same file still drives val/export runs.

task: segment
project: ultralytics/yolo26
name: robobin2026-v1-seg-finetune
exist_ok: false
epochs: 100
batch: 32
nbs: 32
imgsz: 640
workers: 16
cache: disk
deterministic: false
amp: bf16
optimizer: MuSGD
pretrained: true
save: true
verbose: true
multi_scale: 0.0
mask_ratio: 4
classes:
conf:
embed:
line_width:
opset:
workspace:

# Validation
split: val
# 'val' in the dataset YAML is a directory, so is_coco is False and the COCO-JSON eval never runs.
# save_json would only add per-epoch RLE dumps and the slower process_mask_native path.
save_json: false
plots: true

# Loss weights
box: 7.5
cls: 0.5
dfl: 1.5
# train annotations are imbalanced (cardboard_box 68.4% vs conveyor_belt 1.6%), which lets the
# majority class dominate the classification BCE. cls_pw is left at its 0.0 default rather than
# guessed; try `cls_pw=0.5` to dampen the 42x inverse-frequency ratio to about 6.5x and compare.
cls_pw: 0.0

# Optimizer schedule
# The pretrained backbone already carries strong features, so lr0 sits an order of magnitude below
# the from-scratch 0.01 and the schedule is roughly three times shorter.
lr0: 0.001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Augmentation
mosaic: 1.0
close_mosaic: 10
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
translate: 0.1
scale: 0.5
fliplr: 0.5
mixup: 0.0
copy_paste: 0.3

# Prediction / export
agnostic_nms: false
augment: false
dynamic: false
format: torchscript
keras: false
nms: false
optimize: false
retina_masks: false
simplify: true
stream_buffer: false
vid_stride: 1
visualize: false
show: false
save_conf: false
save_crop: false
save_frames: false
save_txt: false
show_boxes: true
show_conf: true
show_labels: true
tracker: botsort.yaml
