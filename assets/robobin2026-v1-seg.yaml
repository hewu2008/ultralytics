# robobin2026-v1 instance segmentation dataset (converted COCO layout)
# Produced by run_convert_robobin2026_coco.sh + run_prepare_robobin2026_v1_seg.sh, then rewritten
# in place by run_rewrite_robobin2026_v1_split.sh: the duplicated test split was dropped, valid was
# merged into train, unlabeled and byte-identical duplicate images were removed, and images/valid
# now holds a stratified 10000-image validation split with no content overlap against train.
# /data/4T-2/dataset/robobin2026/robobin2026-v1
# ├── annotations/instances_{train,valid}.json
# ├── images/{train,valid}
# └── labels/{train,valid}
path: /data/4T-2/dataset/robobin2026/robobin2026-v1
train: images/train
val: images/valid

# Order follows category_id in the COCO json, which prepare_robobin2026_seg.py maps to 0..4.
names:
  0: cardboard_box
  1: material_bin
  2: pallet
  3: conveyor_belt
  4: human
