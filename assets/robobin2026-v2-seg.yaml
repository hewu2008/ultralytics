# robobin2026-v2 instance segmentation dataset (converted COCO layout)
# Produced by run_prepare_robobin2026_v2_seg.sh, which turns annotations/instances_<split>.json into
# labels/<split>. v2 is single-class (cardboard_box only), 1920x1080 source frames, and keeps its
# test split.
# run_remove_robobin2026_v2_unlabeled.sh then deleted the 667 images that carried no annotation
# (train 522/1422, valid 76/178, test 69/178): the model detects cardboard_box in 100% of them at a
# mean top confidence of 0.978, so Ultralytics was training them as negatives and scoring every
# prediction on them as a false positive. images/ == labels/ per split now, no background images left.
# /data/4T-2/dataset/robobin2026/robobin2026-v2
# ├── annotations/instances_{train,valid,test}.json   900 / 102 / 109 images
# ├── images/{train,valid,test}                       900 / 102 / 109
# └── labels/{train,valid,test}                       900 / 102 / 109
#
# Label-quality caveat measured with the v1-trained yolo26l-seg (see conversation audit): every
# annotated image holds exactly two boxes, a large one (model IoU 0.95, 100% matched) and a small one
# nested against its bottom edge (matched only 55%, 38% at IoU<0.1), so recall stays capped at ~0.77.
# On this cleaned val split those weights score box P 0.951 / R 0.775 / mAP50 0.843 / mAP50-95 0.762
# (mask mAP50-95 0.757); with the background images present the same run read 0.591 / 0.773 / 0.513 / 0.463.

path: /data/4T-2/dataset/robobin2026/robobin2026-v2
train: images/train
val: images/valid
test: images/test

# Order follows category_id in the COCO json, which prepare_robobin2026_seg.py maps to 0.
names:
  0: cardboard_box