# YOLO26l-seg from-scratch training arguments for COCO2017 instance segmentation.
# Consumed by scripts/run_train_yolo26l_seg.sh via `cfg=`. Any value here can be
# overridden on the command line, e.g. `... epochs=10 batch=64`.
#
# Hyperparameters follow the Ultralytics defaults (ultralytics/cfg/default.yaml), which
# target from-scratch training. The fine-tuning search values from the original command
# (lr0=0.00038, lrf=0.88, box=9.83, mixup=0.43, copy_paste=0.40, ...) are replaced.
#
# Values not used by `mode=train` (conf, vid_stride, format, opset, ...) are kept
# verbatim from the original command so the same file still drives val/export runs.

task: segment
project: ultralytics/yolo26
name: yolo26l-seg
exist_ok: false
epochs: 300
batch: 32
nbs: 32
imgsz: 640
workers: 16
cache: disk
deterministic: false
optimizer: MuSGD
pretrained: false
save: true
verbose: true
multi_scale: 0.0
mask_ratio: 4
classes:
conf:
embed:
line_width:
opset:
workspace:

# Validation
split: val
# 'val' in the dataset YAML is a directory, so is_coco is False and the COCO-JSON eval never runs.
# save_json would only add per-epoch RLE dumps and the slower process_mask_native path.
save_json: false
plots: true

# Loss weights
box: 7.5
cls: 0.5
dfl: 1.5

# Optimizer schedule
lr0: 0.01
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
translate: 0.1
scale: 0.5
fliplr: 0.5
mixup: 0.0
copy_paste: 0.3

# Prediction / export
agnostic_nms: false
augment: false
dynamic: false
format: torchscript
keras: false
nms: false
optimize: false
retina_masks: false
simplify: true
stream_buffer: false
vid_stride: 1
visualize: false
show: false
save_conf: false
save_crop: false
save_frames: false
save_txt: false
show_boxes: true
show_conf: true
show_labels: true
tracker: botsort.yaml